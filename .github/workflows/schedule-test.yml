name: Schedule Test

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print time
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "UTC:"
          date -u
          echo "Beijing:"
          TZ=Asia/Shanghai date
